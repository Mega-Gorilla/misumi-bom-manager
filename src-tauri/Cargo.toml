[package]
name = "misumi-bom-manager"
version = "0.2.0"
description = "MISUMI BOM manager desktop application"
authors = ["hahah"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "misumi_bom_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["sync", "time"] }
rusqlite = { version = "0.32", features = ["bundled"] }
calamine = "0.26"          # read .xlsx/.xls/.ods
rust_xlsxwriter = "0.79"   # write .xlsx
csv = "1"                  # read/write CSV
encoding_rs = "0.8"        # CSV decode (Shift-JIS fallback) / BOM handling
sha2 = "0.10"              # content fingerprints for Excel link mode (plan §4.6.1)
zip = "2"                  # xlsx zip walkers for Excel link mode (already in the tree via calamine)
notify = "8"               # file watching for Excel link mode (plan §4.2.3 / PR-7)

# Excel link mode environment checks (plan §4.10): reparse-tag walk, volume FS name,
# .lnk resolution. Versions match what the dependency tree already locks.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_Storage_FileSystem",
] }


